x-internal-environment: &internal-environment
  IM_INTERNAL_SECRET: ${IM_INTERNAL_SECRET:-airway-im-local-development-secret}
  TZ: ${TZ:-Asia/Shanghai}
  NO_PROXY: backend,gateway,delivery,127.0.0.1,localhost
  no_proxy: backend,gateway,delivery,127.0.0.1,localhost

services:
  gateway:
    build:
      context: ./gateway
      dockerfile: Containerfile
      args:
        GOPROXY: ${GOPROXY:-https://goproxy.cn,direct}
    image: airway-im-gateway:local
    environment:
      <<: *internal-environment
      GATEWAY_ADDR: :1910
      INTERNAL_SERVICE_URL: http://backend:1906
      GATEWAY_ALLOWED_ORIGINS: ${GATEWAY_ALLOWED_ORIGINS:-}
    ports:
      - "${GATEWAY_PORT:-1910}:1910"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:1910/readyz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s
    restart: unless-stopped

  delivery:
    build:
      context: ./delivery
      dockerfile: Containerfile
      args:
        GOPROXY: ${GOPROXY:-https://goproxy.cn,direct}
    image: airway-im-delivery:local
    environment:
      <<: *internal-environment
      DELIVERY_ADDR: :1920
      INTERNAL_SERVICE_URL: http://backend:1906
      GATEWAY_URL: http://gateway:1910
      DELIVERY_POLL_INTERVAL_MS: ${DELIVERY_POLL_INTERVAL_MS:-500}
    depends_on:
      backend:
        condition: service_healthy
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:1920/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s
    restart: unless-stopped
